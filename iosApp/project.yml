# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). We check this
# human-editable YAML into git instead of a hand-authored .xcodeproj -- CI
# runs `xcodegen generate` to produce the real .xcodeproj right before
# building. This is far less error-prone than hand-writing pbxproj by hand
# (which is what a fully offline port like this one would otherwise require),
# at the cost of needing xcodegen installed (it's a one-line `brew install`
# on the GitHub macOS runner, see .github/workflows/ios-build.yml).
name: iosApp
options:
  bundleIdPrefix: com.example.alarmbuddy
  # AlarmKit (see AlarmKitBridge.swift) requires iOS 26 -- there's no older
  # fallback path, since AlarmKit is what lets alarms ring through Silent
  # Mode/Focus and survive a force-quit without a paid developer account
  # (the old local-notification-burst approach couldn't do either).
  deploymentTarget:
    iOS: "26.0"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmbuddy
        INFOPLIST_FILE: iosApp/Info.plist
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO
        # CI builds against the generic "platform=iOS Simulator" destination
        # (no specific device), so Xcode can't tell which arch is "active" and
        # falls back to its full standard list -- arm64 *and* x86_64 -- even
        # though every Mac running this build is Apple Silicon. composeApp's
        # Kotlin targets only include iosSimulatorArm64 (iosX64 was dropped:
        # Compose Multiplatform 1.12.0 doesn't publish that variant anymore),
        # so Gradle's Compose-resources sync task has nothing to map x86_64 to
        # and fails with "Unknown iOS simulator arch: 'x86_64'". Excluding it
        # here is the standard fix for this exact KMP situation.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
        # Where `./gradlew :composeApp:embedAndSignAppleFrameworkForXcode` (run
        # by the CI script, mirroring what Xcode's own KMP-plugin build phase
        # does) drops the built ComposeApp.framework.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/**"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      # SQLDelight's native-driver (Touchlab's SQLiter) cinterops directly
      # against the C sqlite3 API instead of bundling its own copy, so the
      # final app binary -- not just the ComposeApp.framework -- has to link
      # the system library, or symbols like sqlite3_open_v2 are left
      # undefined at link time.
      - sdk: libsqlite3.tbd
    preBuildScripts:
      # This one script both builds the Kotlin/Native framework AND embeds +
      # signs it into the app bundle -- the same thing the JetBrains KMP
      # wizard's default Xcode template wires up, just expressed through
      # XcodeGen instead of a hand-edited pbxproj Run Script phase.
      - name: Build and embed Kotlin/Native framework (ComposeApp)
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
